# NodePort simplu, fără ingress — accesibil direct pe orice nod al clusterului,
# ex. http://<IP_Tailscale_HP_EliteBook>:30070
apiVersion: v1
kind: Service
metadata:
  name: cloudestorage
  namespace: cloudestorage
spec:
  type: NodePort
  selector:
    app: cloudestorage
  ports:
    - port: 7070
      targetPort: 7070
      nodePort: 30070
